<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notebook II</title>
  <meta name="description" content="A text database in the style of Notebook II from Pro/Tem Software">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%2300a%22/%3E%3Cpath d=%22M3 3h10v10H3z%22 fill=%22none%22 stroke=%22%230aa%22/%3E%3Cpath d=%22M5 6h6M5 8h6M5 10h4%22 stroke=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>try { var t = localStorage.getItem('nb2:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div class="app">
    <header id="title"></header>
    <main id="main" tabindex="-1"></main>
    <form id="findbar" hidden>
      <label for="findinput">Find:</label>
      <input id="findinput" autocomplete="off" spellcheck="false">
      <span class="hint">word &nbsp; field:word &nbsp; "a phrase" &nbsp; hist* &nbsp; a OR b &nbsp; -word &nbsp; (empty shows all)</span>
    </form>
    <div id="status" role="status"></div>
    <nav id="keys" aria-label="Commands"></nav>
  </div>
  <pre id="print-area"></pre>

  <template id="helptext">
    <div class="panel help">
      <h2>Notebook II</h2>
      <p>A database for text. Each database has fields you name (Author, Title, Notes …) and every record fills them in with as much text as it needs. Find records by any word, sort them, and print them through forms you design.</p>

      <h2>Keys</h2>
      <table class="keys-table">
        <tr><td><kbd>F1</kbd></td><td>This help</td><td><kbd>F6</kbd></td><td>Sort by up to three fields</td></tr>
        <tr><td><kbd>F2</kbd></td><td>Edit the record</td><td><kbd>F7</kbd></td><td>Print forms and printing</td></tr>
        <tr><td><kbd>F3</kbd></td><td>Add a record</td><td><kbd>F8</kbd></td><td>Add, rename, reorder fields</td></tr>
        <tr><td><kbd>F4</kbd> or <kbd>/</kbd></td><td>Find records</td><td><kbd>F9</kbd></td><td>Import a file</td></tr>
        <tr><td><kbd>F5</kbd></td><td>Show all records again</td><td><kbd>F10</kbd></td><td>Export (or Save while editing)</td></tr>
        <tr><td><kbd>Enter</kbd></td><td>Show the whole record</td><td><kbd>Del</kbd></td><td>Delete the record</td></tr>
        <tr><td><kbd>PgUp</kbd> <kbd>PgDn</kbd></td><td>Previous / next record</td><td><kbd>Esc</kbd></td><td>Back, or close the database</td></tr>
      </table>
      <p class="hint">Every command is also on the bar at the bottom of the screen, so you can click or tap instead.</p>

      <h2>While editing a record</h2>
      <table class="keys-table">
        <tr><td><kbd>F5</kbd></td><td>Copy from the previous record: fills the source fields (Author, Title, Year …) that are still blank, and leaves the note alone. Choose which fields it copies in Fields (<kbd>F8</kbd>).</td></tr>
        <tr><td><kbd>F6</kbd></td><td>Copy just the field the cursor is in from the previous record</td></tr>
        <tr><td><kbd>F10</kbd> or <kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>Save</td></tr>
      </table>
      <p>"Previous record" means the one you were on when you pressed <kbd>F3</kbd> to add a record (after saving a record, that is the one just saved), or, when you edit with <kbd>F2</kbd>, the record before it in the list.</p>

      <h2>Light or dark</h2>
      <p>The screen follows your computer's light or dark setting. Click the word at the right of the title bar, or press <kbd>Alt</kbd>+<kbd>T</kbd>, to switch between Auto, Light and Dark. This browser remembers the choice.</p>

      <h2>Finding records</h2>
      <table class="keys-table">
        <tr><td><code>smith</code></td><td>the word anywhere in the record</td></tr>
        <tr><td><code>author:smith</code></td><td>only in the Author field (the start of a field name is enough)</td></tr>
        <tr><td><code>"civil war"</code></td><td>a phrase</td></tr>
        <tr><td><code>hist*</code> &nbsp; <code>wom?n</code></td><td>any ending &nbsp;/&nbsp; any one letter</td></tr>
        <tr><td><code>labor south</code></td><td>both words (same as <code>labor AND south</code>)</td></tr>
        <tr><td><code>labor OR textiles</code></td><td>either word</td></tr>
        <tr><td><code>-south</code> &nbsp; <code>NOT south</code></td><td>without the word</td></tr>
        <tr><td><code>(a OR b) c</code></td><td>grouping</td></tr>
        <tr><td><code>notes:</code> &nbsp; <code>notes:*</code></td><td>Notes is blank &nbsp;/&nbsp; Notes has something</td></tr>
        <tr><td><code>"date of birth":1850</code></td><td>quote field names that have spaces</td></tr>
        <tr><td><code>title=the</code> &nbsp; <code>-title=the</code></td><td>Title begins / doesn't begin with "the"</td></tr>
        <tr><td><code>year&gt;1980</code> &nbsp; <code>author&lt;=m</code></td><td>the field begins later / the same or earlier in alphabetical or numerical order (also <code>&lt;</code> and <code>&gt;=</code>)</td></tr>
      </table>
      <p>Capitals and accents don't matter. Sorting and printing work on the records found.</p>

      <h2>Importing your Notebook II files</h2>
      <p><strong>Database files.</strong> A Notebook II database called NAME is several files. Press <kbd>F9</kbd> and choose <code>NAME.DAT</code>, <code>NAME.DEF</code> and <code>NAME.IDX</code> together (add <code>NAME.MSC</code> and any custom print formats, <code>*.R00</code>, if you have them). Records you marked deleted are left out unless you tick <em>Include records marked deleted</em>, and print formats become print forms. The <code>.DAT</code> file alone also works, but then field names are missing and records you edited in Notebook II show up once for every saved copy.</p>
      <p><strong>Text files.</strong> The import also reads text written by Notebook II or other programs: delimited text with any field and record delimiters, tagged <code>Field: value</code> text, Notebook II's own import text (<code>%Start:</code>, <code>%Author:…</code>, <code>%End:</code>), and DOS characters (code page 437) such as accented letters and box lines. It guesses the layout and shows a preview, and you can change the delimiters before importing. Anything else can be opened with <em>Read as: Salvage</em>, which pulls out the readable text.</p>
      <p><strong>Back to DOS.</strong> <kbd>F10</kbd> Export &gt; Notebook II import text writes a file that Notebook II's Utilities &gt; Import reads in Notebook format.</p>

      <h2>Where your data is kept</h2>
      <p>Databases are saved in this browser as you work. To move them to another computer, or to keep a backup, use <kbd>F10</kbd> Export &gt; Notebook file, and Import that file elsewhere.</p>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
