<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notebook II</title>
  <meta name="description" content="A text database in the style of Notebook II from Pro/Tem Software">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%2300a%22/%3E%3Cpath d=%22M3 3h10v10H3z%22 fill=%22none%22 stroke=%22%230aa%22/%3E%3Cpath d=%22M5 6h6M5 8h6M5 10h4%22 stroke=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>try { var t = localStorage.getItem('nb2:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div class="app">
    <header id="title">
      <span class="brand">NOTEBOOK II</span>
      <span class="dbname"></span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Find records" hidden>
      <span class="count"></span>
      <button type="button" class="theme" id="themebtn" title="Light or dark screen (Alt+T)"></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <div id="status" role="status"></div>
    <nav id="keys" aria-label="Commands"></nav>
  </div>
  <pre id="print-area"></pre>
  <div id="palette" hidden>
    <div class="pbox" role="dialog" aria-label="Commands">
      <input id="pinput" autocomplete="off" spellcheck="false" placeholder="Type a command or a field name" aria-label="Command">
      <ul id="plist" role="listbox"></ul>
    </div>
  </div>

  <template id="helptext">
    <div class="panel help">
      <h2>Notebook II</h2>
      <p>A database for text. Each database has fields you name (Author, Title, Notes …) and every record fills them in with as much text as it needs. Find records by any word, sort them, and print them through forms you design.</p>

      <h2>Getting around</h2>
      <p>Every command is on the bar at the bottom of the screen: click or tap it, or press the key shown on it. <kbd data-key-label="Ctrl+k">Ctrl+K</kbd> opens a list of every command; type part of a name (<code>exp</code> for Export, <code>sort year</code> to sort by Year) and press Enter.</p>
      <table class="keys-table">
        <tr><td><kbd>/</kbd> or <kbd>F</kbd></td><td>Find: jump to the search box in the title bar. Results update as you type; Enter or ↓ goes to the list, Esc clears it.</td></tr>
        <tr><td><kbd>N</kbd></td><td>New note</td></tr>
        <tr><td>Click, or <kbd>Enter</kbd></td><td>Open a record</td></tr>
        <tr><td>Column heading</td><td>Sort by that field; click again for Z to A, a third time for the order entered. <kbd>S</kbd> sorts by up to three fields.</td></tr>
        <tr><td><kbd>P</kbd> &nbsp; <kbd>X</kbd> &nbsp; <kbd>I</kbd></td><td>Print, Export, Import</td></tr>
        <tr><td><kbd>Del</kbd></td><td>Delete the record</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>Back: leaves a field, then the record, then closes the database</td></tr>
        <tr><td><kbd>?</kbd></td><td>This help</td></tr>
      </table>
      <p class="hint">The F-keys of the original work too: F2 edit, F3 new, F4 find, F5 show all, F6 sort, F7 print, F8 fields, F9 import, F10 export.</p>

      <h2>On a record</h2>
      <p>A record opens ready to read and to change: click a field and type. Changes are saved as you go. <em>Revert</em> on the command bar puts the record back as it was when you opened it.</p>
      <table class="keys-table">
        <tr><td><kbd data-key-label="Ctrl+d">Ctrl+D</kbd></td><td>Copy from the previous record: fills the source fields (Author, Title, Year …) that are still blank, and leaves the note alone. Choose which fields it copies in Fields.</td></tr>
        <tr><td><kbd data-key-label="Ctrl+Shift+d">Ctrl+Shift+D</kbd></td><td>Copy just the field the cursor is in from the previous record</td></tr>
        <tr><td><kbd>PgUp</kbd> <kbd>PgDn</kbd></td><td>Previous / next record (also ← → when you are not in a field)</td></tr>
        <tr><td><kbd>E</kbd> or <kbd>Enter</kbd></td><td>Start typing in the record</td></tr>
      </table>
      <p>"Previous record" means, for a new note, the record you were on when you made it, so after one note you can press <kbd>N</kbd> and then <kbd data-key-label="Ctrl+d">Ctrl+D</kbd> for the next note on the same book. For an existing record it is the one before it in the list.</p>

      <h2>Light or dark</h2>
      <p>The screen follows your computer's light or dark setting. Click the word at the right of the title bar, or press <kbd>Alt</kbd>+<kbd>T</kbd>, to switch between Auto, Light and Dark. This browser remembers the choice.</p>

      <h2>Finding records</h2>
      <table class="keys-table">
        <tr><td><code>smith</code></td><td>the word anywhere in the record</td></tr>
        <tr><td><code>author:smith</code></td><td>only in the Author field (the start of a field name is enough)</td></tr>
        <tr><td><code>"civil war"</code></td><td>a phrase</td></tr>
        <tr><td><code>hist*</code> &nbsp; <code>wom?n</code></td><td>any ending &nbsp;/&nbsp; any one letter</td></tr>
        <tr><td><code>labor south</code></td><td>both words (same as <code>labor AND south</code>)</td></tr>
        <tr><td><code>labor OR textiles</code></td><td>either word</td></tr>
        <tr><td><code>-south</code> &nbsp; <code>NOT south</code></td><td>without the word</td></tr>
        <tr><td><code>(a OR b) c</code></td><td>grouping</td></tr>
        <tr><td><code>notes:</code> &nbsp; <code>notes:*</code></td><td>Notes is blank &nbsp;/&nbsp; Notes has something</td></tr>
        <tr><td><code>"date of birth":1850</code></td><td>quote field names that have spaces</td></tr>
        <tr><td><code>title=the</code> &nbsp; <code>-title=the</code></td><td>Title begins / doesn't begin with "the"</td></tr>
        <tr><td><code>year&gt;1980</code> &nbsp; <code>author&lt;=m</code></td><td>the field begins later / the same or earlier in alphabetical or numerical order (also <code>&lt;</code> and <code>&gt;=</code>)</td></tr>
      </table>
      <p>Capitals and accents don't matter. Sorting and printing work on the records found.</p>

      <h2>Importing your Notebook II files</h2>
      <p><strong>Database files.</strong> A Notebook II database called NAME is several files. Choose Import (<kbd>I</kbd>) and select <code>NAME.DAT</code>, <code>NAME.DEF</code> and <code>NAME.IDX</code> together (add <code>NAME.MSC</code> and any custom print formats, <code>*.R00</code>, if you have them). Records you marked deleted are left out unless you tick <em>Include records marked deleted</em>, and print formats become print forms. The <code>.DAT</code> file alone also works, but then field names are missing and records you edited in Notebook II show up once for every saved copy.</p>
      <p><strong>Text files.</strong> The import also reads text written by Notebook II or other programs: delimited text with any field and record delimiters, tagged <code>Field: value</code> text, Notebook II's own import text (<code>%Start:</code>, <code>%Author:…</code>, <code>%End:</code>), and DOS characters (code page 437) such as accented letters and box lines. It guesses the layout and shows a preview, and you can change the delimiters before importing. Anything else can be opened with <em>Read as: Salvage</em>, which pulls out the readable text.</p>
      <p><strong>Back to DOS.</strong> Export (<kbd>X</kbd>) &gt; Notebook II import text writes a file that Notebook II's Utilities &gt; Import reads in Notebook format.</p>

      <h2>Where your data is kept</h2>
      <p>Databases are saved in this browser as you work. To move them to another computer, or to keep a backup, use Export (<kbd>X</kbd>) &gt; Notebook file, and Import that file elsewhere.</p>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
