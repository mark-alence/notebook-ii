<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThreeByFive</title>
  <meta name="description" content="ThreeByFive: records with fields you name, each holding text of any length, like index cards">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f3352">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // The screen (light, dark or retro) and the Appearance settings, before the page first draws.
    try {
      var t = localStorage.getItem('nb2:theme');
      if (t === 'light' || t === 'dark' || t === 'retro') document.documentElement.dataset.theme = t;
      var a = JSON.parse(localStorage.getItem('nb2:appearance')) || {};
      var v = a.vars || {};
      for (var k in v) document.documentElement.style.setProperty(k, v[k]);
      var l = (a.settings || {}).labels;
      if (l === 'above' || l === 'beside') document.documentElement.dataset.labels = l;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header id="title">
      <span class="brand">ThreeByFive</span>
      <span class="dbname"></span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Find records" hidden>
      <span class="count"></span>
      <button type="button" class="theme" id="themebtn" title="Light, dark or retro screen (Alt+T)"></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <div id="status" role="status"></div>
    <nav id="keys" aria-label="Commands"></nav>
  </div>
  <div id="ask" class="overlay" hidden>
    <div class="pbox" role="alertdialog" aria-labelledby="askmsg">
      <p id="askmsg"></p>
      <input id="askinput" autocomplete="off" spellcheck="false" aria-labelledby="askmsg" hidden>
      <div class="buttons"><button type="button" id="askyes">Yes</button><button type="button" id="askno">Cancel</button></div>
      <p class="hint"><kbd>Y</kbd> yes &nbsp; <kbd>N</kbd> or <kbd>Esc</kbd> no</p>
    </div>
  </div>
  <div id="palette" hidden>
    <div class="pbox" role="dialog" aria-label="Commands">
      <input id="pinput" autocomplete="off" spellcheck="false" placeholder="Type a command or a field name" aria-label="Command">
      <ul id="plist" role="listbox"></ul>
    </div>
  </div>

  <template id="helptext">
    <div class="panel help">
      <h2>ThreeByFive</h2>
      <p>A stack of records, like a box of index cards. Each stack has fields you name (Author, Title, Notes …) and every record fills them in with as much text as it needs. Find records by any word, sort them, mark the ones you want, and export them as text, spreadsheets, or PDFs laid out with forms you design.</p>

      <h2>Getting around</h2>
      <p>Every command is on the bar at the bottom of the screen: click or tap it, or press the key shown on it. <kbd data-key-label="Ctrl+k">Ctrl+K</kbd> opens a list of every command; type part of a name (<code>exp</code> for Export, <code>sort year</code> to sort by Year) and press Enter.</p>
      <table class="keys-table">
        <tr><td><kbd>/</kbd> <kbd>F</kbd> or <kbd data-key-label="Ctrl+f">Ctrl+F</kbd></td><td>Find, with the box in the title bar. In the list it finds records: the list narrows as you type, Enter or ↓ goes to the list, Esc clears it. On a record the same box finds text inside that record (see below); the list's search comes back when you return to the list.</td></tr>
        <tr><td><kbd>N</kbd></td><td>New record</td></tr>
        <tr><td>Click, or <kbd>Enter</kbd></td><td>Open a record</td></tr>
        <tr><td>Column heading</td><td>Sort by that field; click again for Z to A, a third time to go back to date order. <kbd>S</kbd> sorts by as many fields as you like.</td></tr>
        <tr><td><kbd>X</kbd> &nbsp; <kbd>I</kbd></td><td>Export, Import</td></tr>
        <tr><td><kbd>P</kbd></td><td>Export with a custom form, as a text file or a PDF</td></tr>
        <tr><td><kbd>M</kbd>, or click the ✓ column</td><td>Mark or unmark the record (also on an open record). Marks collect a hand-picked set to find, export or delete together; see <em>Marked records</em> below. <kbd>Shift</kbd>+<kbd>M</kbd> clears all marks, after asking.</td></tr>
        <tr><td><kbd>Del</kbd></td><td>Delete the record, after asking. When records are marked, Del in the list deletes all the marked records instead (the command bar says "Delete 3 marked"); to delete one record then, open it and press Del there.</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>Back: on a record, the first Esc stops editing (then N starts a new record, E edits again) and the next goes back to the list; in the list, Esc closes the stack</td></tr>
        <tr><td><kbd>?</kbd></td><td>This help</td></tr>
      </table>

      <h2>On a record</h2>
      <p>A record opens ready to read and to change: click a field and type. Fields can be any length; long text simply scrolls. Changes are saved as you go. <em>Revert</em> on the command bar puts the record back as it was when you opened it.</p>
      <table class="keys-table">
        <tr><td><kbd data-key-label="Ctrl+d">Ctrl+D</kbd></td><td>In a new record: copy previous. Fills the fields ticked "Copy into new records" in Fields (say Author, Title and Year) from the record you were on when you pressed <kbd>N</kbd>. If one of them already has different text, it asks before replacing it.</td></tr>
        <tr><td><kbd data-key-label="Ctrl+Shift+d">Ctrl+Shift+D</kbd></td><td>In a new record: copy just the field the cursor is in from that record, asking first if that would replace text</td></tr>
        <tr><td><kbd data-key-label="Ctrl+s">Ctrl+S</kbd></td><td>Save now (it saves as you type anyway)</td></tr>
        <tr><td><kbd>Tab</kbd> <kbd>Shift</kbd>+<kbd>Tab</kbd></td><td>Next / previous field. Inside a field, ↑ ↓ PgUp PgDn move through the text.</td></tr>
        <tr><td><kbd data-key-label="Ctrl+Home">Ctrl+Home</kbd> <kbd data-key-label="Ctrl+End">Ctrl+End</kbd></td><td>Start / end of the whole record</td></tr>
        <tr><td><kbd>PgUp</kbd> <kbd>PgDn</kbd></td><td>Previous / next record, when you are not in a field (also ← →). In a field, <kbd>Alt</kbd>+<kbd>PgUp</kbd> / <kbd>PgDn</kbd>.</td></tr>
        <tr><td><kbd>E</kbd> or <kbd>Enter</kbd></td><td>Start typing in the record</td></tr>
        <tr><td><kbd data-key-label="Ctrl+f">Ctrl+F</kbd> or <kbd>/</kbd></td><td>Find in this record, in the box in the title bar: type text or a <code>/regex/</code> (a regular expression); every match is highlighted, Enter goes to the next and Shift+Enter the previous, Esc puts the cursor on the match. The words stay as you page to other records with PgUp/PgDn. (<kbd>/</kbd> only when you are not typing in a field.)</td></tr>
        <tr><td><kbd>Ctrl</kbd>+<kbd>Space</kbd></td><td>Start a block, as in Emacs: move the cursor with the arrows, Home, End, PgUp or PgDn (Ctrl for whole words) and the block follows. Ctrl+C copies it, Ctrl+X cuts it, Delete or typing replaces it, Esc or Ctrl+Space again cancels it. On a Mac, if Ctrl+Space switches keyboard languages, select with Shift and the arrow keys instead.</td></tr>
      </table>
      <p><kbd data-key-label="Ctrl+d">Ctrl+D</kbd> and <kbd data-key-label="Ctrl+Shift+d">Ctrl+Shift+D</kbd> work only in a new record, from pressing <kbd>N</kbd> until you leave it; once you go back to the list or to another record it is an ordinary record and they are not offered. They copy from the record you were on when you pressed <kbd>N</kbd> (open, or highlighted in the list), so after one record you can press <kbd>N</kbd> and then <kbd data-key-label="Ctrl+d">Ctrl+D</kbd> for the next one from the same source. The line under the fields names it, e.g. "copies Author, Title and Year from <strong>#125 (Darnton, Robert)</strong>".</p>

      <h2>Projects</h2>
      <p>A project groups stacks, say all those for one book or thesis. On the web page: The <em>Project</em> list at the top of the start screen (<kbd>P</kbd>) shows one project's stacks, the Unfiled ones, or all of them; the choice is remembered. <em>New project</em>, <em>Rename</em> and <em>Delete</em> sit beside it; deleting a project keeps its stacks, as Unfiled. New stacks, imported ones and the sample go into the project on screen, and a stack can be moved to another project on its Fields screen. The title bar shows the project before the stack's name. A stack's project is kept in its backups.</p>
      <p>In the desktop app a project is a folder, as in RStudio. <em>New project…</em> (also in the File menu) asks where to put it: choose a folder or make a new one; it gets <code>backup</code> and <code>exported</code> folders inside. <em>Open project…</em> makes any existing folder a project. The project's stacks are the <code>.3x5</code> files at the top of its folder, and new stacks, imports and the sample are saved there without asking. <em>Back up a copy</em> saves a dated copy in <code>backup</code>, and Export starts in <code>exported</code>; you need not keep files there. Delete on the start screen moves a stack's file to the Trash (Recycle Bin), where it can be restored. <em>Remove from list</em> only takes the project off the list; the folder is untouched. With <em>None</em> chosen, the start screen lists recent stack files wherever they are.</p>

      <h2>Fields</h2>
      <p>A stack is whatever fields you give it, and every field holds plain text of any length. Dates and numbers are typed as text too: <code>1938-03-17</code> sorts in date order, and so does <code>1938-03-17 (approx.)</code>. In Fields you can rename, add, remove and reorder fields, tick which ones are copied into new records, set how many lines each one shows when a record opens, and, under <em>Columns in the list</em>, choose which fields the list shows and in what order, separately from the order of the fields in a record. A new stack shows every field as a column to begin with; remove the ones you don't need there. Column widths follow the contents, so a short field such as Year gets a narrow column. The list remembers how you last sorted it.</p>
      <p>Unless sorted by a field, the list shows the newest records first, in the order they were made. Every record has a number of its own, shown as <code>#127</code> in the list's first column and at the top of the record: it is given when the record is made and never changes or gets reused, so you can note it down to refer to the record. Click the <code>#</code> heading to switch between newest and oldest first, or choose <em>Oldest first</em> on the Sort screen (<kbd>S</kbd>) or in the command list (<kbd data-key-label="Ctrl+k">Ctrl+K</kbd>); the stack remembers it.</p>

      <h2>Appearance</h2>
      <p>The word at the right of the title bar, or <kbd>Alt</kbd>+<kbd>T</kbd>, switches the screen between <em>Auto</em> (follows your computer's light or dark setting), <em>Light</em>, <em>Dark</em> and <em>Retro</em>. Dark is made for long reading in low light: a very dark blue rather than black, off-white rather than pure white text, and soft colours. Retro is the blue screen of a 1980s DOS program.</p>
      <p><em>Appearance</em> in the command list (<kbd data-key-label="Ctrl+k">Ctrl+K</kbd>, or View → Appearance in the desktop app) also sets the font (<em>Match the theme</em>: a modern monospace, or the DOS screen font in Retro; or the DOS screen font, sans-serif, serif, or any font installed on your computer), the text size and the line spacing, where a record's field names go (<em>Automatic</em>: beside the text when the window is wide enough to show the whole record, above it otherwise, giving the text the full width; or always above, or always beside), and how many records the list shows: all of them (the default), or 200, 500 or 1,000 at a time for a very large stack. The choices are kept on this computer.</p>

      <h2>Finding records</h2>
      <table class="keys-table">
        <tr><td><code>smith</code></td><td>anywhere in the record, also inside longer words (smithy, Goldsmith); <code>cott</code> finds cotton</td></tr>
        <tr><td><code>"smith"</code></td><td>only the whole word</td></tr>
        <tr><td><code>author:smith</code></td><td>only in the Author field (the start of a field name is enough)</td></tr>
        <tr><td><code>"civil war"</code></td><td>a phrase</td></tr>
        <tr><td><code>hist*</code> &nbsp; <code>wom?n</code></td><td>any ending &nbsp;/&nbsp; any one letter</td></tr>
        <tr><td><code>labor south</code></td><td>both words (same as <code>labor AND south</code>)</td></tr>
        <tr><td><code>labor OR textiles</code></td><td>either word</td></tr>
        <tr><td><code>-south</code> &nbsp; <code>NOT south</code></td><td>without the word</td></tr>
        <tr><td><code>(a OR b) c</code></td><td>grouping</td></tr>
        <tr><td><code>notes:</code> &nbsp; <code>notes:*</code></td><td>Notes is blank &nbsp;/&nbsp; Notes has something</td></tr>
        <tr><td><code>"date of birth":1850</code></td><td>quote field names that have spaces</td></tr>
        <tr><td><code>title=the</code> &nbsp; <code>-title=the</code></td><td>Title begins / doesn't begin with "the"</td></tr>
        <tr><td><code>year&gt;1980</code> &nbsp; <code>author&lt;=m</code></td><td>the field begins later / the same or earlier in alphabetical or numerical order (also <code>&lt;</code> and <code>&gt;=</code>)</td></tr>
        <tr><td><code>/colou?r/</code></td><td>a regular expression, anywhere in the record. Letters after it change how it matches: <code>c</code> matches capitals exactly (<code>/Smith/c</code>; otherwise capitals don't matter); <code>m</code> makes <code>^</code> and <code>$</code> match at the start and end of each line in a field, not just of the whole field (<code>/^see /m</code>); <code>s</code> lets <code>.</code> match line breaks too (<code>/begin.*end/s</code>). They combine: <code>/^Smith/cm</code></td></tr>
        <tr><td><code>#127</code></td><td>record number 127 (Enter opens it)</td></tr>
        <tr><td><code>#120-140</code> &nbsp; <code>#12,15,31</code> &nbsp; <code>#500-</code></td><td>a range of record numbers, a list of them, or 500 and later; mix them with other terms, e.g. <code>#1-200 -farmers</code></td></tr>
        <tr><td><code>@marked</code> &nbsp; <code>-@marked</code></td><td>records you have marked / not marked, e.g. <code>@marked year&gt;1980</code></td></tr>
        <tr><td><code>citation:/^CO 9\d/</code></td><td>a regular expression in one field; mix it with any other terms, e.g. <code>/^19[34]\d/ -farmers</code></td></tr>
      </table>
      <p>Capitals and accents don't matter. Sorting and exporting work on the records found.</p>

      <h2>Marked records</h2>
      <p>When the records you want don't share a search term or a run of numbers, mark them one by one: <kbd>M</kbd> on a row of the list or on an open record, or a click in the ✓ column. The title bar counts them. In the command list (<kbd data-key-label="Ctrl+k">Ctrl+K</kbd>): <em>Show marked records</em> (the same as searching <code>@marked</code>), <em>Mark all records in the list</em> (say after a search), <em>Clear all marks</em> (<kbd>Shift</kbd>+<kbd>M</kbd>, after asking) and <em>Delete marked records</em> (also <kbd>Del</kbd> in the list while records are marked). Export's Records choice has <em>The marked</em>. Marks are kept with the stack and in backups, and marking a record does not count as changing it.</p>

      <h2>Importing</h2>
      <p>Import (<kbd>I</kbd>) first asks what kind of file to read, then for the file: <em>Any file</em> (ThreeByFive works out the kind), a <em>ThreeByFive stack</em> (a backup), a <em>Spreadsheet (CSV)</em>, <em>Tab-delimited text</em>, <em>Tagged text</em> (<code>Field: value</code> lines, as in ThreeByFive's own vertical text), <em>Other delimited text</em> (any separators), <em>Salvage</em> or a <em>Notebook II database</em>. A preview follows, where you can still change how the file is read (<em>Read as</em>) and its delimiters, and choose whether the records make a new stack or join the open one. DOS characters (code page 437), such as accented letters and box lines, are recognised.</p>
      <p><strong>Salvage</strong> pulls every readable piece of text out of any file, one piece per record, so nothing is lost even from a damaged file or one of unknown kind. Files that are not text at all are salvaged automatically, and a file that cannot be read any other way offers a <em>Try Salvage</em> button.</p>
      <p><strong>Notebook II.</strong> ThreeByFive was inspired by Notebook II, a 1980s DOS program, and can import its files. A Notebook II database called NAME is several files: choose <code>NAME.DAT</code>, <code>NAME.DEF</code> and <code>NAME.IDX</code> together (add <code>NAME.MSC</code> and any custom print formats, <code>*.R00</code>, if you have them). Records marked deleted are left out unless you tick <em>Include records marked deleted</em>, and print formats become custom forms. The <code>.DAT</code> file alone also works, but then field names are missing and records edited in Notebook II show up once for every saved copy. Notebook II's own import text (<code>%Start:</code>, <code>%Author:…</code>, <code>%End:</code>) is read as tagged text.</p>

      <h2>Where your data is kept</h2>
      <p>Stacks are saved in this browser as you work. They are not on your other devices, and clearing the browser's history or site data deletes them. <em>Backup</em> on the command bar (<kbd data-key-label="Ctrl+Shift+s">Ctrl+Shift+S</kbd>) saves a copy of the open stack as a file (<code>.3x5.json</code>); Import reads it back, on this computer or another. If a stack has changed and has not been backed up for a week, it reminds you when you open it.</p>
      <p>In the <strong>desktop app</strong> each stack is instead a file on your computer (<code>.3x5</code>; older files, <code>.nb2</code>, open too), saved as you type: back it up like any other document. File → Open (<kbd>O</kbd>) opens one, and Save As (<kbd data-key-label="Ctrl+Shift+s">Ctrl+Shift+S</kbd>) turns a stack kept inside the app into a file.</p>
      <p>Export also writes <em>vertical text</em>: each record's fields one after another, long text under its label. It is the most readable copy to keep or quote from, and Import can read it back. Exports follow the list's current order and search, or take all records, or the marked ones, or <em>These record numbers</em> (say <code>12-40, 55</code>). Vertical text, CSV, tab-separated, tagged and custom-delimited exports can include each record's number as a <code>Record#</code> line or column; importing that file into a new stack keeps the numbers, while adding it to an existing stack gives the records new ones. Every text export is UTF-8.</p>

      <h2>Custom forms and PDFs</h2>
      <p>Export (<kbd>X</kbd>) → <em>Custom form</em>, or <kbd>P</kbd>, lays records out your own way, with a live preview. A form is a template filled in once per record: <code>{Field}</code> puts in a field, <code>{Field:20}</code> exactly 20 characters of it, <code>{Record#}</code> the record's own number (<code>127</code>; <code>{#id}</code> gives <code>#127</code>), <code>{#}</code> its place in the output (1, 2, 3 …), and a line written as <code>[[ … ]]</code> is left out when its fields are blank. A form may have a page header and footer, where <code>{@page}</code>, <code>{@pages}</code>, <code>{@date}</code> and <code>{@time}</code> give the page number, the number of pages, today's date and the time; the <code>@</code> keeps them apart from your own fields, so <code>{Date}</code> is always a field called Date. Forms are kept with the stack, and print formats imported from Notebook II (<code>*.R00</code>) become forms.</p>
      <p>A custom form or vertical text can be saved as a text file or as a <strong>PDF</strong>. For a PDF choose the paper (A4 or US Letter), the text size and the font: <em>Monospace</em> (the default) keeps columns and the labels of vertical text lined up, while <em>Serif</em> and <em>Sans-serif</em> look more like a book or a modern document but do not keep such alignment, since their letters differ in width. The font is built into the PDF, so it looks the same everywhere. Pages are laid out to fit, with the header and footer on each page, and a record is not split across pages when it fits on one. To print on paper, print the PDF. A text file has no font or pages of its own (whatever program opens it decides); it has the header at the start and the footer at the end. The paper, text size and font you choose, and whether you last saved a text file or a PDF, are kept on this computer for next time.</p>

      <h2>Version</h2>
      <p>This copy: <span data-version></span>. After an update, one reload brings the new version; if it ever seems not to, Ctrl+Shift+R (Cmd+Shift+R on a Mac) loads everything afresh.</p>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
