# Publish the app to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The PDF tests need jsPDF from package-lock.json.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Collect the site files
        run: |
          mkdir _site && cp -r index.html manifest.webmanifest sw.js css js icons fonts _site/
          node scripts/stamp-version.mjs _site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
