# Builds the desktop app for macOS, Windows and Linux and attaches the
# installers to a public GitHub release named after the version in
# tauri.conf.json. Run it from the Actions tab ("Run workflow"; tick "draft" to
# keep the release hidden until you publish it), or push a tag such as v0.2.0.
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Make a draft release, visible only to the repository's owners until published
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The release is made once, before the builds, so the three of them only
  # add their installers to it (made by each build, they could collide).
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        env:
          DRAFT: ${{ inputs.draft == true }}
          RELEASE_BODY: |
            Desktop installers for ThreeByFive. Stacks are .3x5 files; double-clicking one opens it.
            - macOS: the .dmg (one build for Apple silicon and Intel). Open it and drag ThreeByFive to Applications. The app is not signed yet, so the first time macOS says it cannot check the developer: choose Done, then in System Settings > Privacy & Security choose Open Anyway (on older macOS, right-click the app and choose Open). After that it opens normally.
            - Windows: the -setup.exe (or the .msi). Windows may say it protected your PC because the publisher is unknown: choose More info, then Run anyway.
            - Linux: on Ubuntu or Debian the .deb: sudo apt install ./ThreeByFive_*_amd64.deb (then start it from the applications menu). On Fedora the .rpm. Anywhere else the .AppImage: make it executable (chmod +x) and run it.
        with:
          script: |
            const version = JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.slice(10) : `v${version}`;
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            let release = all.find((r) => r.tag_name === tag);
            if (release) {
              core.info(`Adding to the release for ${tag}`);
            } else {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `ThreeByFive v${version}`, body: process.env.RELEASE_BODY,
                draft: process.env.DRAFT === 'true', prerelease: false,
              }));
              core.info(`Made the release for ${tag}`);
            }
            core.setOutput('id', release.id);

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
