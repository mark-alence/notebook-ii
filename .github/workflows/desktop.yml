# Builds the desktop app for macOS, Windows and Linux and attaches the
# installers to a draft GitHub release. Run it from the Actions tab
# ("Run workflow"), or push a tag such as v0.2.0. Then open Releases, check the
# draft and publish it.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Notebook II v__VERSION__
          releaseBody: |
            Desktop installers for Notebook II.
            - macOS: the .dmg (works on Apple silicon and Intel). The app is not signed yet: the first time, right-click it and choose Open.
            - Windows: the .msi or the -setup.exe. Windows may warn that the publisher is unknown: choose More info, then Run anyway.
            - Linux: the .AppImage, .deb or .rpm.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
