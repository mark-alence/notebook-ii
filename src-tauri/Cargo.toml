[package]
name = "threebyfive"
version = "0.1.2"
description = "ThreeByFive: records with fields you name, like index cards"
edition = "2021"
license = "MIT"

[lib]
name = "threebyfive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
